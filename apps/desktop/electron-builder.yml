appId: com.leadsghr.desktop
productName: LeadsGhr
electronDist: node_modules/electron/dist
# better-sqlite3 is already rebuilt for Electron by the root postinstall (rebuild:native); do not rebuild it again while packaging.
npmRebuild: false
directories:
  output: dist-installer
files:
  - out/**/*
extraResources:
  - from: resources/leadsghr-icon.png
    to: icons/leadsghr-icon.png
  - from: ../extension/leadsghr-tracker.zip
    to: leadsghr-tracker.zip
  - from: ../mailer-extension/leadsghr-mailer.zip
    to: leadsghr-mailer.zip
  - from: ../scraper-extension/leadsghr-scraper.zip
    to: leadsghr-scraper.zip
  # The branded uninstall window (setup/LeadsGhrUninstall.cs, built by `pnpm build:uninstall` before packaging).
  - from: setup/out/LeadsGhr-Uninstall.exe
    to: LeadsGhr-Uninstall.exe
win:
  icon: resources/leadsghr-icon.ico
  # Web installer: electron-builder makes LeadsGhr-Installer.exe plus the app package (.nsis.7z) and latest.yml.
  # People download LeadsGhr-Setup.exe (setup/, built by setup/build-setup.ps1), which downloads both and runs
  # LeadsGhr-Installer.exe silently. Installed copies update through latest.yml and the same two files.
  target: nsis-web
nsisWeb:
  # Same name in every release; latest.yml points at it.
  artifactName: LeadsGhr-Installer.${ext}
  # Uninstall opens LeadsGhr's own window and can keep or delete the data (see setup/installer.nsh).
  include: setup/installer.nsh
  # Used when LeadsGhr-Installer.exe is run on its own; scripts/finish-web-installer.mjs gives the package this name.
  appPackageUrl: https://github.com/abrarhaider001/LeadsGhr/releases/latest/download/LeadsGhr-App-x64.nsis.7z
# Where installed copies look for updates (electron-updater). Publishing itself is done by the release workflow.
publish:
  provider: github
  owner: abrarhaider001
  repo: LeadsGhr
  releaseType: release

