appId: com.leadsghr.desktop
productName: LeadsGhr
electronDist: node_modules/electron/dist
# better-sqlite3 is already rebuilt for Electron by the root postinstall (rebuild:native); do not rebuild it again while packaging.
npmRebuild: false
directories:
  output: dist-installer
files:
  - out/**/*
extraResources:
  - from: resources/leadsghr-icon.png
    to: icons/leadsghr-icon.png
  - from: ../extension/leadsghr-tracker.zip
    to: leadsghr-tracker.zip
  - from: ../mailer-extension/leadsghr-mailer.zip
    to: leadsghr-mailer.zip
win:
  icon: resources/leadsghr-icon.ico
  # Web installer only: a small LeadsGhr-Setup.exe that downloads the app package (.nsis.7z) from the
  # GitHub Release of the same version while installing. Installed copies update from the same files.
  target: nsis-web
nsisWeb:
  # Same name in every release, so .../releases/latest/download/LeadsGhr-Setup.exe always works.
  artifactName: LeadsGhr-Setup.${ext}
  # The setup file always installs the newest release; scripts/finish-web-installer.mjs gives the package this name.
  appPackageUrl: https://github.com/abrarhaider001/LeadsGhr/releases/latest/download/LeadsGhr-App-x64.nsis.7z
# Where installed copies look for updates (electron-updater). Publishing itself is done by the release workflow.
publish:
  provider: github
  owner: abrarhaider001
  repo: LeadsGhr
  releaseType: release

