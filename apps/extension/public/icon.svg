<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 1024 1024" role="img" aria-label="LeadsGhr Tracker logo">
  <defs>
    <!-- Both LeadsGhr Mailer plane colours in one gradient: the upper wing's purples flowing into the lower wing's deep purple. -->
    <linearGradient id="g" x1="928" y1="96" x2="96" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E0CF2"/>
      <stop offset="0.35" stop-color="#6403E8"/>
      <stop offset="0.7" stop-color="#3B0197"/>
      <stop offset="1" stop-color="#1B003A"/>
    </linearGradient>
    <!-- The double tick is cut out, so the background shows through. -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <path d="M250 560 L380 690 L600 430 M520 640 L570 690 L790 430" fill="none" stroke="#000" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="96" y="96" width="832" height="832" rx="150" fill="url(#g)" mask="url(#cut)"/>
</svg>
