# Applies Supabase migrations and deploys Edge Functions to the hosted project
# when Supabase files change on ANY branch push (owner's choice). There is one live project, so the
# most recent push from any branch wins. Runs on GitHub's servers; no Docker or local CLI needed.
#
# Repository settings required (Settings → Secrets and variables → Actions):
#   Secret   SUPABASE_ACCESS_TOKEN  Personal access token from https://supabase.com/dashboard/account/tokens
#   Variable SUPABASE_PROJECT_ID    Project ref (the id in the dashboard URL)
#
# Function secrets such as MAIL_TRACKING_REGISTRATION_KEY stay in the Supabase dashboard and are not
# managed here. Migrations must be additive and safe: they run against the live database.
name: Supabase deploy

on:
  push:
    branches: ['**']
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:
    inputs:
      mark_applied:
        description: 'One-time only: migration numbers already applied by hand, separated by spaces (e.g. "0001 0002 0003"). Leave empty normally.'
        required: false
        default: ''
      dry_run:
        description: 'Only show which migrations would be applied; change nothing.'
        type: boolean
        required: false
        default: false

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Check repository settings
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret."; exit 1; fi
          if ! [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]; then echo "::error::Set the SUPABASE_PROJECT_ID repository variable to the 20-character project ref."; exit 1; fi

      - name: Mark hand-applied migrations (one-time)
        if: github.event_name == 'workflow_dispatch' && inputs.mark_applied != '' && inputs.dry_run != true
        env:
          VERSIONS: ${{ inputs.mark_applied }}
        run: |
          if ! [[ "$VERSIONS" =~ ^[0-9]+( [0-9]+)*$ ]]; then echo "::error::Use migration numbers separated by single spaces, e.g. 0001 0002 0003"; exit 1; fi
          # shellcheck disable=SC2086
          supabase migration repair --status applied $VERSIONS --remote="$SUPABASE_PROJECT_ID" --yes

      - name: Show migration status
        run: supabase migration list --remote="$SUPABASE_PROJECT_ID"

      - name: Apply migrations
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            supabase db push --dry-run --remote="$SUPABASE_PROJECT_ID"
          else
            supabase db push --remote="$SUPABASE_PROJECT_ID" --yes
          fi

      - name: Deploy Edge Functions
        if: env.DRY_RUN != 'true'
        run: |
          # JWT verification per function comes from supabase/config.toml (mail-tracking: verify_jwt = false).
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            [ -f "$dir/index.ts" ] || continue
            echo "Deploying $name"
            supabase functions deploy "$name" --use-api --remote="$SUPABASE_PROJECT_ID" --yes
          done
