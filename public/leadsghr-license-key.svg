<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" role="img" aria-label="LeadsGhr license key">
  <defs>
    <linearGradient id="lg-key-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1FA9C9"/>
      <stop offset=".55" stop-color="#5B12C9"/>
      <stop offset="1" stop-color="#3A0C8A"/>
    </linearGradient>
    <linearGradient id="lg-key-bow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B3BE0"/>
      <stop offset="1" stop-color="#4A0FA6"/>
    </linearGradient>
  </defs>
  <!-- Key drawn horizontally (tip on the left), then turned so the bow sits top right like the reference. -->
  <g transform="translate(250 268) rotate(-42) translate(-205 0)" stroke="#190B2D" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- Back half of the ring, behind the bow -->
    <ellipse cx="392" cy="-30" rx="58" ry="62" fill="none" stroke="#190B2D" stroke-width="15"/>
    <ellipse cx="392" cy="-30" rx="58" ry="62" fill="none" stroke="#5B12C9" stroke-width="6"/>
    <!-- Blade with teeth -->
    <path d="M214 -20 L66 -20 L30 0 L48 20 L58 20 L66 34 L76 20 L88 20 L96 34 L106 20 L118 20 L126 34 L136 20 L150 20 L158 30 L166 20 L214 20 Z" fill="url(#lg-key-metal)"/>
    <!-- Groove along the blade -->
    <path d="M200 -4 L74 -4 L58 4" fill="none" stroke-width="5"/>
    <path d="M200 -11 L80 -11" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="4"/>
    <!-- Collar and neck -->
    <path d="M206 -30 L226 -30 L226 30 L206 30 Z" fill="#4A0FA6"/>
    <path d="M226 -20 L262 -24 L262 24 L226 20 Z" fill="url(#lg-key-bow)"/>
    <!-- Bow (head) -->
    <path d="M258 -38 C270 -86 340 -92 372 -62 C402 -34 402 30 372 58 C340 88 270 84 258 38 C252 14 252 -14 258 -38 Z" fill="url(#lg-key-bow)"/>
    <path d="M276 -40 C292 -70 336 -72 356 -52" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="9"/>
    <path d="M272 -8 C270 20 284 50 316 62" fill="none" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="7"/>
    <!-- Hole -->
    <circle cx="352" cy="-14" r="16" fill="#FFFFFF"/>
    <!-- Front part of the ring, passing through the hole -->
    <path d="M340 -2 C352 30 392 38 420 22" fill="none" stroke="#190B2D" stroke-width="15"/>
    <path d="M340 -2 C352 30 392 38 420 22" fill="none" stroke="#5B12C9" stroke-width="6"/>
  </g>
</svg>
