<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" role="img" aria-label="LeadsGhr license key">
  <!-- Line-art key in the LeadsGhr logo colours: navy #190B2D outlines, purple #5B12C9 shading, white body.
       Drawn lying flat (tip on the left), then turned 45 degrees so the head and ring sit top right. -->
  <g transform="translate(262 262) rotate(-45) translate(-285 4)" stroke="#190B2D" stroke-linejoin="round" stroke-linecap="round" fill="none">

    <!-- Split ring, back part (behind the head) -->
    <circle cx="482" cy="-6" r="62" stroke-width="17"/>
    <circle cx="482" cy="-6" r="62" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M500 -65 A62 62 0 0 1 540 16" stroke="#5B12C9" stroke-width="3"/>

    <!-- Blade -->
    <path d="M258 -26 L74 -26 L38 -4 L60 24 L82 24 L90 38 L102 24 L112 24 L120 38 L132 24 L142 24 L150 38 L162 24 L174 24 L182 36 L190 24 L258 24 Z" fill="#FFFFFF" stroke-width="8"/>
    <!-- Upper spine with the stepped cut near the tip -->
    <path d="M252 -12 L96 -12 L84 -20 L70 -20" stroke-width="5"/>
    <!-- Long groove along the blade -->
    <path d="M246 4 L84 4 L64 14" stroke-width="5"/>
    <path d="M240 11 L92 11" stroke="#5B12C9" stroke-width="5"/>
    <!-- Shading under the spine and along the toothed edge -->
    <path d="M244 -6 L104 -6" stroke="#5B12C9" stroke-width="3"/>
    <path d="M236 19 L196 19" stroke="#5B12C9" stroke-width="4"/>

    <!-- Collar -->
    <path d="M256 -34 L276 -34 L276 34 L256 34 Z" fill="#FFFFFF" stroke-width="8"/>
    <path d="M266 -30 L266 30" stroke="#5B12C9" stroke-width="4"/>

    <!-- Neck flaring into the head -->
    <path d="M276 -22 C292 -24 300 -34 312 -44 L312 44 C300 34 292 24 276 22 Z" fill="#FFFFFF" stroke-width="8"/>
    <path d="M282 14 C292 16 300 24 306 32" stroke="#5B12C9" stroke-width="4"/>

    <!-- Head (bow) -->
    <path d="M306 -40 C312 -82 368 -94 416 -84 C458 -74 470 -40 468 0 C466 42 452 76 410 84 C364 92 312 80 306 40 C302 14 302 -14 306 -40 Z" fill="#FFFFFF" stroke-width="9"/>
    <!-- Raised rim inside the head -->
    <path d="M322 -34 C328 -66 372 -74 410 -68 C444 -62 454 -36 452 -2 C450 34 440 60 406 66 C368 72 326 64 322 34 C319 12 319 -12 322 -34 Z" stroke-width="5"/>
    <!-- Purple shading on the lower side of the head and rim -->
    <path d="M330 44 C340 64 372 70 404 66 C432 62 446 44 450 18" stroke="#5B12C9" stroke-width="7"/>
    <path d="M316 50 C326 76 362 84 400 80" stroke="#5B12C9" stroke-width="3"/>
    <path d="M338 -48 C350 -62 374 -64 396 -60" stroke="#5B12C9" stroke-width="3"/>

    <!-- Hole for the ring -->
    <circle cx="428" cy="-40" r="14" fill="#FFFFFF" stroke-width="7"/>
    <path d="M418 -32 A14 14 0 0 0 440 -34" stroke="#5B12C9" stroke-width="3"/>

    <!-- Split ring, front part passing through the hole -->
    <path d="M428 -40 A62 62 0 0 1 463 -65" stroke-width="17"/>
    <path d="M428 -40 A62 62 0 0 1 463 -65" stroke="#FFFFFF" stroke-width="6"/>
  </g>
</svg>
